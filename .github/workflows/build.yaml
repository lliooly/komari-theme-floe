name: Build and Release Floe Theme

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  NEXT_TELEMETRY_DISABLED: '1'

permissions:
  contents: read

concurrency:
  group: floe-theme-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate theme metadata
        shell: bash
        env:
          EXPECTED_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          manifest_version="$(jq -r '.version // empty' komari-theme.json)"
          manifest_short="$(jq -r '.short // empty' komari-theme.json)"
          manifest_url="$(jq -r '.url // empty' komari-theme.json)"

          [[ "$manifest_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::komari-theme.json version must be MAJOR.MINOR.PATCH; got: $manifest_version"
            exit 1
          }
          test "$manifest_short" = "floe"
          test "$manifest_url" = "$EXPECTED_REPOSITORY_URL"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || {
              echo "::error::release tags must use vMAJOR.MINOR.PATCH; got: $GITHUB_REF_NAME"
              exit 1
            }
            tag_version="${BASH_REMATCH[1]}"
            test "$manifest_version" = "$tag_version"
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate workflows
        run: bash script/check-workflows.sh

      - name: Validate locale structure and placeholders
        run: node script/i18n-sync.mjs --validate

      - name: Lint source
        run: npm run lint

      - name: Test security and request regressions
        run: npm test

      - name: Build static theme
        run: npm run build

      - name: Verify theme files
        shell: bash
        env:
          EXPECTED_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          test -f preview.png
          test -f komari-theme.json
          test -d dist
          test -f dist/index.html
          jq empty komari-theme.json
          test "$(jq -r '.short' komari-theme.json)" = "floe"
          test "$(jq -r '.url' komari-theme.json)" = "$EXPECTED_REPOSITORY_URL"

      - name: Create Komari theme package
        shell: bash
        run: |
          set -euo pipefail

          package_dir="$(mktemp -d "${RUNNER_TEMP}/floe-theme.XXXXXX")"
          trap 'rm -rf "$package_dir"' EXIT

          cp preview.png komari-theme.json "$package_dir/"
          cp -R dist "$package_dir/"

          (
            cd "$package_dir"
            zip -qr "$GITHUB_WORKSPACE/dist-release.zip" .
          )

          unzip -tq dist-release.zip
          # Read the list once: grep -q in a pipe can SIGPIPE unzip under pipefail.
          unzip -Z1 dist-release.zip > "$RUNNER_TEMP/floe-package-files.txt"
          grep -Fxq "komari-theme.json" "$RUNNER_TEMP/floe-package-files.txt"
          grep -Fxq "preview.png" "$RUNNER_TEMP/floe-package-files.txt"
          grep -Fxq "dist/index.html" "$RUNNER_TEMP/floe-package-files.txt"

      - name: Upload theme package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: floe-theme-package
          path: dist-release.zip
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 7 }}
          compression-level: 0

  release:
    if: ${{ github.repository == 'lliooly/komari-theme-floe' && github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: floe-release-publish
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download theme package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: floe-theme-package
          path: release-assets

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: node script/publish-release.mjs
