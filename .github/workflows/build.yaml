name: Build and Release Floe Theme

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: floe-theme-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Validate theme metadata
        shell: bash
        env:
          EXPECTED_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          manifest_version="$(jq -r '.version // empty' komari-theme.json)"
          manifest_short="$(jq -r '.short // empty' komari-theme.json)"
          manifest_url="$(jq -r '.url // empty' komari-theme.json)"

          [[ "$manifest_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::komari-theme.json version must be MAJOR.MINOR.PATCH; got: $manifest_version"
            exit 1
          }
          test "$manifest_short" = "floe"
          test "$manifest_url" = "$EXPECTED_REPOSITORY_URL"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || {
              echo "::error::release tags must use vMAJOR.MINOR.PATCH; got: $GITHUB_REF_NAME"
              exit 1
            }
            tag_version="${BASH_REMATCH[1]}"
            test "$manifest_version" = "$tag_version"
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint source
        run: npm run lint

      - name: Test security and request regressions
        run: npm test

      - name: Build static theme
        run: npm run build

      - name: Verify theme files
        shell: bash
        env:
          EXPECTED_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          test -f preview.png
          test -f komari-theme.json
          test -d dist
          test -f dist/index.html
          jq empty komari-theme.json
          test "$(jq -r '.short' komari-theme.json)" = "floe"
          test "$(jq -r '.url' komari-theme.json)" = "$EXPECTED_REPOSITORY_URL"

      - name: Create Komari theme package
        shell: bash
        run: |
          set -euo pipefail

          package_dir="$(mktemp -d "${RUNNER_TEMP}/floe-theme.XXXXXX")"
          trap 'rm -rf "$package_dir"' EXIT

          cp preview.png komari-theme.json "$package_dir/"
          cp -R dist "$package_dir/"

          (
            cd "$package_dir"
            zip -qr "$GITHUB_WORKSPACE/dist-release.zip" .
          )

          unzip -tq dist-release.zip
          unzip -Z1 dist-release.zip | grep -Fxq "komari-theme.json"
          unzip -Z1 dist-release.zip | grep -Fxq "preview.png"
          unzip -Z1 dist-release.zip | grep -q '^dist/'

      - name: Upload theme package artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: floe-theme-package
          path: dist-release.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download theme package artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: floe-theme-package
          path: release-assets

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          package_path="release-assets/dist-release.zip"
          test -f "$package_path"

          version="${RELEASE_TAG#v}"
          sha256="$(sha256sum "$package_path" | awk '{print $1}')"
          notes="$(cat <<EOF
          Floe ${version} theme package.

          SHA-256: \`${sha256}\`

          Built from commit ${COMMIT_SHA}.
          EOF
          )"

          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$package_path" \
              --repo "$REPOSITORY" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$REPOSITORY" \
              --title "Floe ${version}" \
              --notes "$notes" \
              --latest
          else
            gh release create "$RELEASE_TAG" "$package_path" \
              --repo "$REPOSITORY" \
              --verify-tag \
              --title "Floe ${version}" \
              --notes "$notes" \
              --latest
          fi
