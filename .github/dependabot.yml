version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Match the Node.js runtime in .nvmrc; keep patch/minor updates enabled.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint currently supports TypeScript < 6.1.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      compatible-security-updates:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      compatible-security-updates:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
